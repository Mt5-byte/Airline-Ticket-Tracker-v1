services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skybird
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/skybird?schema=public
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma db push --accept-data-loss --skip-generate && node server.js"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/skybird?schema=public
    command: >
      sh -c "sleep 5 && npx tsx src/worker/index.ts"

volumes:
  db-data:
